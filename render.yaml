services:
  - type: web
    name: student-performance-prediction
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements-deploy.txt && python rebuild_artifacts.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
